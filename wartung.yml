---
- name: Übungs-Playbook Serverwartung
  hosts: localhost
  connection: local
  tasks:
    - name: Zeitstempel-Datei anlegen
      ansible.builtin.file:
        path: /tmp/wartung-test.txt
        state: touch
        mode: '0644'

    - name: Freien Speicherplatz ermitteln
      ansible.builtin.command: df -h /
      register: speicher
      changed_when: false

    - name: Speicherplatz ausgeben
      ansible.builtin.debug:
        var: speicher.stdout_lines
